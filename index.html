<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <title>Norn</title>
    <meta name="description" content="Norn. Optimize everything. Automate the rest." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // decided before first paint so the finished logo never flashes before the intro.
      // the intro plays when someone arrives from outside, not when they come back
      // from a page of this site, so nothing is stored on the device
      (function () {
        var root = document.documentElement;
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var navigation = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        var returning = navigation && navigation.type === "back_forward";
        var internal = false;
        try { internal = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (error) {}
        root.dataset.intro = reduce ? "calm" : returning || internal ? "done" : "play";
      })();
    </script>
  </head>
  <body class="home">
    <main class="hero" id="hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <canvas class="hero-canvas" aria-hidden="true"></canvas>

              <clipPath id="tips-reveal">

            <path id="o-upper" fill="currentColor" fill-rule="evenodd" d="M306.66 224.82A135.04 135.04 0 1 1 519.06 58.67Z" />
            <path id="o-lower" fill="currentColor" fill-rule="evenodd" d="M317.81 236.13A135.04 135.04 0 0 0 527.36 72.21Z" />
            <g clip-path="url(#tips-reveal)"><path fill="currentColor" fill-rule="evenodd" d="M560.60 36.19L522.79 57.64L530.68 67.72ZM274.69 259.84L304.62 228.31L312.50 238.39Z" /></g>
            <g clip-path="url(#o-disc)">
              <rect id="o-cover" fill="currentColor" transform="translate(417.4 147.7) rotate(-38)" x="200" y="-13" width="0" height="26" />
            </g>
          </svg>
        </h1>
        <p class="hero-line intro-after">Optimize everything.<br />Automate the rest.</p>
      </div>

    <script type="module" src="/src/home.ts"></script>
